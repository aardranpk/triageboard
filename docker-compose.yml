services:
  postgres:
    image: postgres:17
    container_name: triageboard-postgres
    environment:
      POSTGRES_DB: triageboard
      POSTGRES_USER: triageboard
      POSTGRES_PASSWORD: triageboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triageboard -d triageboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: