spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/triageboard}
spring.datasource.username=${DB_USERNAME:triageboard}
spring.datasource.password=${DB_PASSWORD:triageboard}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

scoring.base-url=${SCORER_URL:http://localhost:8000}
scoring.timeout-ms=2000